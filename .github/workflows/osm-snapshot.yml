name: OSM snapshot

# Refreshes src/geo/osm-snapshot.json from OpenStreetMap. On a feature branch the new
# snapshot is committed to that branch; on main it is only uploaded as an artifact,
# since main only changes through pull requests.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/fetch-osm-snapshot.ts
      - src/geo/overpass.ts
      - .github/workflows/osm-snapshot.yml

permissions:
  contents: write

concurrency:
  group: osm-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run osm:snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: osm-snapshot
          path: src/geo/osm-snapshot.json
      - name: Commit snapshot to the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geo/osm-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "chore(geo): refresh OSM snapshot"
            git push
          fi

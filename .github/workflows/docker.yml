name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull requests only build the image (amd64), to catch Dockerfile breakage before merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override with the repository variable DOCKER_IMAGE, e.g. `myuser/dannegracht-waterstroom`.
  IMAGE: ${{ vars.DOCKER_IMAGE || (secrets.DOCKERHUB_USERNAME && format('{0}/dannegracht-waterstroom', secrets.DOCKERHUB_USERNAME)) || 'dannegracht-waterstroom' }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build-and-push:
    # On pull requests this only test-builds the image; nothing is pushed.
    name: ${{ github.event_name == 'pull_request' && 'Build image (no push)' || 'Build and push image' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

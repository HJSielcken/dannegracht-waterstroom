# Vul de waarden hieronder in op je server. Zet echte tokens niet in git.
services:
  app:
    image: hjsielcken/dannegracht-waterstroom:latest
    ports:
      - '8533:8080'
    environment:
      # API-sleutel van https://aisstream.io/apikeys (leeg: geen live AIS)
      AISSTREAM_API_KEY: ''
      # Locatiecode van een ARK-meetpunt, zie https://waterinfo.rws.nl (leeg: maarssen.kanaal)
      RWS_ARK_LOCATION_CODE: ''
      # UUID van een Vecht-tijdreeks, zie https://hdsr.lizard.net (leeg: Vecht bij Daalseweg, Maarssen)
      HDSR_VECHT_TIMESERIES_UUID: ''
    restart: unless-stopped

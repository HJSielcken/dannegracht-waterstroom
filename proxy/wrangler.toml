name = "dannegracht-ais-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Non-secret configuration. Override per environment with `wrangler.toml`
# [env.xxx] blocks or `wrangler deploy --var KEY=value` as needed.
[vars]
# Browser origin allowed to call this worker (CORS). Set to your deployed
# app's origin, e.g. "https://<user>.github.io" for GitHub Pages, or
# "http://localhost:5173" for local dev. "*" disables the origin check
# (fine for local testing, not recommended in production).
ALLOWED_ORIGIN = "http://localhost:5173"

# Bounding box for the aisstream.io subscription: [[south, west], [north, east]]
# in decimal degrees, roughly covering the Vecht and ARK around Breukelen
# and the Dannegracht itself. Adjust if boats of interest fall outside it.
AIS_BBOX_SOUTH = "52.15"
AIS_BBOX_WEST = "4.97"
AIS_BBOX_NORTH = "52.20"
AIS_BBOX_EAST = "5.03"

# --- Water level station identifiers -----------------------------------
# NOT independently verified against the live catalogues from this
# environment (no network access beyond search results) — confirm these
# against https://waterinfo.rws.nl (RWS) and https://hdsr.lizard.net (HDSR)
# before relying on them, and correct here if wrong. The worker falls back
# to DEFAULT_LEVELS-equivalent output when a fetch/parse fails.
#
# RWS Waterwebservices/DDL location code for a gauge on the ARK near
# Maarssen/Breukelen (Grootheid WATHTE = waterhoogte, cm t.o.v. NAP).
RWS_ARK_LOCATION_CODE = "MAASS"
# HDSR Lizard timeseries UUID for a Vecht gauge at/near Breukelen.
HDSR_VECHT_TIMESERIES_UUID = ""

# Secrets (do NOT put these here — set them with `wrangler secret put`):
#   AISSTREAM_API_KEY
